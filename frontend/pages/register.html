<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Register Account — Narayani Sarees, Tuljapur</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-om"></i></div>
        <div class="brand-text">
          <h1>NARAYANI</h1>
          <p>Sarees • Tuljapur</p>
        </div>
      </a>
      <a href="/pages/login.html" class="btn btn-outline btn-sm">Sign In</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Join Narayani Sarees for exclusive festival discounts & tracking</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Pooja Patil" required>
        </div>

        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" id="reg-phone" class="form-control" placeholder="10-digit mobile number">
        </div>

        <div class="form-group">
          <label>Create Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">Register Account</button>
      </form>

      <div class="auth-footer-links">
        Already have an account? <a href="/pages/login.html">Sign In Here</a>
      </div>
    </div>
  </div>

  <script src="/js/script.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
