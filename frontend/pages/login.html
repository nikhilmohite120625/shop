<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login / Sign In — Narayani Sarees</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-om"></i></div>
        <div class="brand-text">
          <h1>NARAYANI</h1>
          <p>Sarees • Tuljapur</p>
        </div>
      </a>
      <a href="/pages/shop.html" class="btn btn-outline btn-sm">Browse Collection</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome to Narayani Sarees</h2>
        <p>Sign in to manage your orders, saved sarees & addresses</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Email Address or Mobile Number</label>
          <input type="text" id="login-email" class="form-control" placeholder="name@example.com / 9876543210" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">Sign In</button>

        <div style="text-align:center; margin:16px 0; color:#888; font-size:13px;">— OR USE MOBILE OTP —</div>
        <button type="button" class="btn btn-outline btn-block" onclick="requestOTP()">
          <i class="fas fa-mobile-alt"></i> Login With OTP
        </button>

        <!-- OTP Section (Hidden Initially) -->
        <div id="otp-section" style="display:none; margin-top:20px; text-align:center;">
          <label style="font-size:13px; font-weight:600;">Enter 6-Digit OTP Code</label>
          <input type="text" id="otp-input" class="form-control" style="text-align:center; font-size:18px; letter-spacing:4px; margin:10px auto; max-width:200px;" maxlength="6">
          <button type="button" class="btn btn-secondary btn-sm" onclick="verifyOTP()">Verify OTP & Sign In</button>
        </div>
      </form>

      <!-- Quick-Fill for Testing -->
      <div class="quick-fill-box">
        <span><i class="fas fa-key"></i> Quick Login Presets for Testing:</span>
        <div class="quick-fill-btns">
          <button class="quick-btn" onclick="quickFill('customer@gmail.com', 'Customer@123')">Customer</button>
          <button class="quick-btn" onclick="quickFill('admin@narayanisarees.com', 'Admin@123')">Super Admin</button>
          <button class="quick-btn" onclick="quickFill('manager@narayanisarees.com', 'Manager@123')">Manager</button>
          <button class="quick-btn" onclick="quickFill('staff@narayanisarees.com', 'Staff@123')">Staff</button>
        </div>
      </div>

      <div class="auth-footer-links">
        Don't have an account? <a href="/pages/register.html">Create New Account</a>
      </div>
    </div>
  </div>

  <script src="/js/script.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
